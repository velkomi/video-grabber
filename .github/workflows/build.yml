name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: vg_test_platform
          POSTGRES_USER: vg_test
          POSTGRES_PASSWORD: vg_test_only_password
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U vg_test -d vg_test_platform"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install media tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          curl -fsSL "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.09.16.232951/yt-dlp" -o "$RUNNER_TEMP/yt-dlp"
          echo "f8ca14db511702a5dbfc5a527056312907ddd0914d0b4036f108d6849e17ef61  $RUNNER_TEMP/yt-dlp" | sha256sum -c -
          chmod 0555 "$RUNNER_TEMP/yt-dlp"
      - name: Test platform and worker
        shell: bash
        env:
          VG_TEST_POSTGRES_DSN: Host=127.0.0.1;Port=55439;Database=vg_test_platform;Username=vg_test;Password=vg_test_only_password
          VG_WORKER_FFMPEG: /usr/bin/ffmpeg
          VG_WORKER_FFPROBE: /usr/bin/ffprobe
        run: |
          export VIDEOGRABBER_EVIDENCE="$RUNNER_TEMP/videograbber-evidence"
          export VG_WORKER_YTDLP="$RUNNER_TEMP/yt-dlp"
          mkdir -p "$VIDEOGRABBER_EVIDENCE"
          dotnet test ./tests/VideoGrabber.Platform.Tests/VideoGrabber.Platform.Tests.csproj -c Release --nologo
          dotnet test ./tests/VideoGrabber.Platform.Worker.Tests/VideoGrabber.Platform.Worker.Tests.csproj -c Release --nologo

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\VideoGrabber.slnx
      - name: Build
        run: dotnet build .\VideoGrabber.slnx -c Release --no-restore
      - name: Test Windows regression suites
        shell: pwsh
        run: |
          $env:VIDEOGRABBER_EVIDENCE = Join-Path $env:RUNNER_TEMP 'videograbber-evidence'
          New-Item -ItemType Directory -Force -Path $env:VIDEOGRABBER_EVIDENCE | Out-Null
          dotnet test .\tests\VideoGrabber.Core.Tests\VideoGrabber.Core.Tests.csproj -c Release --no-build
          dotnet test .\tests\VideoGrabber.Infrastructure.Tests\VideoGrabber.Infrastructure.Tests.csproj -c Release --no-build
      - name: Publish portable EXE
        run: dotnet publish .\src\VideoGrabber.App\VideoGrabber.App.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\VideoGrabber-win-x64 --no-restore
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination .\artifacts\VideoGrabber-win-x64
          Compress-Archive -Path .\artifacts\VideoGrabber-win-x64\* -DestinationPath .\artifacts\VideoGrabber-win-x64.zip
          Get-FileHash .\artifacts\VideoGrabber-win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VideoGrabber-win-x64
          path: .\artifacts\VideoGrabber-win-x64.zip
          if-no-files-found: error
          retention-days: 7
