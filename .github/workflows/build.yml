name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\VideoGrabber.slnx
      - name: Build
        run: dotnet build .\VideoGrabber.slnx -c Release --no-restore
      - name: Test
        run: dotnet test .\VideoGrabber.slnx -c Release --no-build
      - name: Publish portable EXE
        run: dotnet publish .\src\VideoGrabber.App\VideoGrabber.App.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\VideoGrabber-win-x64 --no-restore
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination .\artifacts\VideoGrabber-win-x64
          Compress-Archive -Path .\artifacts\VideoGrabber-win-x64\* -DestinationPath .\artifacts\VideoGrabber-win-x64.zip
          Get-FileHash .\artifacts\VideoGrabber-win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VideoGrabber-win-x64
          path: .\artifacts\VideoGrabber-win-x64.zip
          if-no-files-found: error
          retention-days: 7
