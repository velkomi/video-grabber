name: Package preview.55

on:
  push:
    branches:
      - release/preview55-builder-v2

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '0.1.10-preview.55-rc.1') { throw "Unexpected release version: $version" }
          if ($version -notmatch 'preview\.(\d+)') { throw "Preview number was not found in VERSION." }
          $numeric = "0.1.10.$($Matches[1])"
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore .\VideoGrabber.slnx --locked-mode

      - name: Download verified previous runtime seed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/velkomi/video-grabber/releases/download/v0.1.10-preview.53-rc.1/VideoGrabber.Managed-win-x64-0.1.10-preview.53-rc.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'vg-runtime-seed.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $expected = '7db8f9b163dd434158fb39e50ce8447057fd647b3f86c737a4b9f8310f36edf6'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Runtime seed SHA-256 mismatch: $actual" }
          $seed = Join-Path $env:RUNNER_TEMP 'vg-runtime-seed'
          Expand-Archive -LiteralPath $zip -DestinationPath $seed
          $required = @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe','whisper\whisper-cli.exe','whisper\whisper.dll','whisper\ggml.dll','whisper\ggml-base.dll','whisper\ggml-base.bin','whisper\ggml-silero-v6.2.0.bin')
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $seed ('tools\' + $item)))) { throw "Runtime seed is incomplete: $item" }
          }
          "VG_RUNTIME_SEED=$seed\tools" >> $env:GITHUB_ENV

      - name: Publish Local and Managed full bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $root = Join-Path $env:RUNNER_TEMP 'vg-preview55'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          .\scripts\Publish-FullLocal.ps1 -RuntimeRoot $env:VG_RUNTIME_SEED -OutputDirectory (Join-Path $root "$version-Local") -Edition Local
          .\scripts\Publish-FullLocal.ps1 -RuntimeRoot $env:VG_RUNTIME_SEED -OutputDirectory (Join-Path $root "$version-Managed") -Edition Managed
          foreach ($edition in @('Local','Managed')) {
            $dir = Join-Path $root "$version-$edition"
            Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination $dir -Force
            Copy-Item docs\MEDIA_WORKFLOWS.md -Destination $dir -Force
          }
          "VG_PACKAGE_ROOT=$root" >> $env:GITHUB_ENV

      - name: Package portable ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $out = Join-Path $env:RUNNER_TEMP 'vg-release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path (Join-Path $env:VG_PACKAGE_ROOT "$version-Local\*") -DestinationPath (Join-Path $out "VideoGrabber.Local-win-x64-$version.zip") -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $env:VG_PACKAGE_ROOT "$version-Managed\*") -DestinationPath (Join-Path $out "VideoGrabber.Managed-win-x64-$version.zip") -CompressionLevel Optimal
          "VG_RELEASE_ASSETS=$out" >> $env:GITHUB_ENV

      - name: Install pinned NSIS 3.12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.12.0 -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey NSIS install failed: $LASTEXITCODE" }
          $candidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe was not found after installing NSIS 3.12.0.' }
          $versionText = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($versionText -notmatch '3\.12') { throw "Unexpected NSIS version: $versionText" }
          "VG_NSIS=$makensis" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $numeric = '${{ steps.version.outputs.numeric }}'
          $release = Join-Path $env:VG_PACKAGE_ROOT "$version-Managed"
          & $env:VG_NSIS "/DRELEASE_DIR=$release" "/DOUTPUT_DIR=$env:VG_RELEASE_ASSETS" "/DAPP_VERSION_TEXT=$version" "/DAPP_VERSION_NUMERIC=$numeric" ".\deploy\windows\videograbber-setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          $setup = Join-Path $env:VG_RELEASE_ASSETS 'VideoGrabber-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'Installer was not created.' }
          $info = (Get-Item -LiteralPath $setup).VersionInfo
          if ($info.ProductVersion -notlike "$version*") { throw "Installer ProductVersion mismatch: $($info.ProductVersion)" }

      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem -LiteralPath $env:VG_RELEASE_ASSETS -File | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $manifest = Join-Path $env:VG_RELEASE_ASSETS "VideoGrabber-$version.sha256.txt"
          $lines | Set-Content -LiteralPath $manifest -Encoding ascii
          Get-Content -LiteralPath $manifest

      - name: Upload full preview assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VideoGrabber-${{ steps.version.outputs.version }}
          path: |
            ${{ env.VG_RELEASE_ASSETS }}\VideoGrabber-Setup.exe
            ${{ env.VG_RELEASE_ASSETS }}\VideoGrabber.Local-win-x64-${{ steps.version.outputs.version }}.zip
            ${{ env.VG_RELEASE_ASSETS }}\VideoGrabber.Managed-win-x64-${{ steps.version.outputs.version }}.zip
            ${{ env.VG_RELEASE_ASSETS }}\VideoGrabber-${{ steps.version.outputs.version }}.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          "Preview.55: site feature blocks; true EXE installer; owner TOTP 2FA admin; paused/stopped model changes; TXT-only course ASR; hardened retry; recursive .vg-asr-* cleanup." | Set-Content -LiteralPath $notes -Encoding utf8
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) { throw "Release $tag already exists; refusing to overwrite it." }
          gh release create $tag (Join-Path $env:VG_RELEASE_ASSETS 'VideoGrabber-Setup.exe') (Join-Path $env:VG_RELEASE_ASSETS "VideoGrabber.Local-win-x64-$version.zip") (Join-Path $env:VG_RELEASE_ASSETS "VideoGrabber.Managed-win-x64-$version.zip") (Join-Path $env:VG_RELEASE_ASSETS "VideoGrabber-$version.sha256.txt") --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VideoGrabber $version" --notes-file $notes --prerelease
