<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VideoGrabber</title>
  <link rel="stylesheet" href="/miniapp/styles.css">
</head>
<body>
<main class="shell">
  <header class="hero">
    <div><p class="eyebrow">VideoGrabber</p><h1>Аккаунт</h1></div>
    <button id="refresh" type="button">Обновить</button>
  </header>
  <p id="status" class="status" role="status" aria-live="polite">Подключение…</p>
  <section class="card"><h2>Профиль</h2><p id="profile">—</p></section>
  <section class="card"><h2>Баланс и доступ</h2>
    <p id="balance" class="metric">—</p><p id="access-reason">—</p><p id="access-until">—</p>
  </section>
  <section class="card"><h2>Способы входа</h2><div id="providers" class="list"></div></section>
  <section class="card"><h2>Компьютеры</h2><div id="devices" class="list"></div></section>
  <section class="card"><h2>Media</h2>
    <p id="capability">Проверяю доступность worker…</p>
    <form id="media-form">
      <label for="media-url">URL источника</label>
      <input id="media-url" type="url" autocomplete="off" required>
      <button id="media-analyze" type="submit">Анализировать</button>
    </form>
    <div id="media-options" hidden>
      <label for="media-operation">Операция</label>
      <select id="media-operation"></select>
      <label for="media-quality">Качество</label>
      <select id="media-quality"></select>
      <label for="media-executor">Исполнитель</label>
      <select id="media-executor"></select>
      <label for="media-inputs">Artifact ID через запятую (для trim/join/transcribe)</label>
      <input id="media-inputs" autocomplete="off">
      <div class="row">
        <input id="media-trim-start" inputmode="numeric" placeholder="start ms">
        <input id="media-trim-duration" inputmode="numeric" placeholder="duration ms">
      </div>
      <button id="media-create" type="button">Добавить в очередь</button>
    </div>
    <div id="media-jobs" class="list"></div>
  </section>
  <section class="card"><h2>Получатели</h2>
    <p>Для привязки сервер заново проверит права вашего Telegram-аккаунта и бота.</p>
    <form id="destination-form">
      <label for="destination-chat">Telegram chat ID</label>
      <input id="destination-chat" inputmode="numeric" autocomplete="off" required>
      <label for="destination-title">Название</label>
      <input id="destination-title" maxlength="80" autocomplete="off" required>
      <button type="submit">Проверить и привязать</button>
    </form>
    <div id="destinations" class="list"></div>
  </section>
  <section id="admin" class="card" hidden>
    <h2>Admin</h2>
    <form id="admin-search">
      <label for="admin-identity">ID провайдера или подтверждённый email</label>
      <div class="row"><input id="admin-identity" autocomplete="off" required><button>Найти</button></div>
    </form>
    <div id="admin-results" class="list"></div>
    <a class="button-link" href="/admin/">Открыть MFA-защищённую консоль</a>
  </section>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/miniapp/app.js"></script>
<script type="module" src="/miniapp/media.js"></script>
</body>
</html>
