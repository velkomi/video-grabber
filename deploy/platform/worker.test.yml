services:
  worker-tests:
    build:
      context: ../..
      dockerfile: deploy/platform/worker.Dockerfile
      target: test-runner
    network_mode: none
    read_only: true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/lib/videograbber/jobs:size=4g,mode=0700
    ulimits:
      nofile:
        soft: 256
        hard: 256
      nproc:
        soft: 128
        hard: 128
    environment:
      HOME: /tmp
      TMPDIR: /tmp
