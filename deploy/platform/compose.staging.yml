name: ${VG_ENVIRONMENT_NAME:?stage name required}

services:
  postgres:
    image: ${VG_POSTGRES_IMAGE:?pinned postgres image required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: videograbber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videograbber"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN","DAC_OVERRIDE","FOWNER","SETGID","SETUID"]

  migrator:
    image: ${VG_API_IMAGE:?pinned api image required}
    restart: "no"
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh","-ec"]
    command:
      - export VG_PLATFORM_MIGRATION_DSN="$$(cat /run/secrets/migration_dsn)"; exec gosu 10001:10001 dotnet VideoGrabber.Platform.Api.dll --migrate-platform
    secrets:
      - migration_dsn
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETGID","SETUID"]

  role-provisioner:
    image: ${VG_POSTGRES_IMAGE:?pinned postgres image required}
    restart: "no"
    depends_on:
      migrator:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh","-ec"]
    command:
      - exec bash /opt/videograbber/provision_runtime_roles.sh
    volumes:
      - ./provision_runtime_roles.sh:/opt/videograbber/provision_runtime_roles.sh:ro
    secrets:
      - postgres_password
      - api_password
      - identity_password
      - admin_password
      - ledger_password
      - device_password
      - operations_password
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  egress-proxy:
    image: ${VG_EGRESS_PROXY_IMAGE:?pinned egress proxy image required}
    restart: unless-stopped
    user: "13:13"
    entrypoint: ["squid"]
    command: ["-f","/etc/squid/squid.conf","-NYC"]
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [internal, edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=13,gid=13
      - /var/spool/squid:size=16m,mode=0750,uid=13,gid=13
      - /var/log/squid:size=8m,mode=0750,uid=13,gid=13
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  volume-init:
    image: ${VG_POSTGRES_IMAGE:?pinned postgres image required}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh","-ec"]
    command:
      - chmod 0700 /data; chown 10001:10001 /data
    volumes:
      - workerjobs:/data
    networks: [internal]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]

  api:
    image: ${VG_API_IMAGE:?pinned api image required}
    restart: unless-stopped
    user: "0:0"
    depends_on:
      role-provisioner:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_started
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        export VG_PLATFORM_API_DSN="$$(cat /run/secrets/api_dsn)"
        export VG_PLATFORM_IDENTITY_DSN="$$(cat /run/secrets/identity_dsn)"
        export VG_PLATFORM_ADMIN_DSN="$$(cat /run/secrets/admin_dsn)"
        export VG_PLATFORM_LEDGER_DSN="$$(cat /run/secrets/ledger_dsn)"
        export VG_PLATFORM_DEVICE_DSN="$$(cat /run/secrets/device_dsn)"
        export VG_PLATFORM_OPERATIONS_DSN="$$(cat /run/secrets/operations_dsn)"
        export VG_SERVER_WORKER_TOKEN="$$(cat /run/secrets/worker_token)"
        export VG_OPERATIONS_TOKEN="$$(cat /run/secrets/operations_token)"
        export VG_PLATFORM_SESSION_SIGNING_KEY="$$(cat /run/secrets/session_key)"
        export VG_PLATFORM_LEASE_SIGNING_KEY_PKCS8="$$(cat /run/secrets/lease_signing_key_pkcs8)"
        export VG_SOURCE_ENCRYPTION_KEY="$$(cat /run/secrets/source_encryption_key)"
        export VG_LAST_BACKUP_UTC="$$(cat /run/secrets/last_backup_utc)"
        export VG_RETENTION_DRY_RUN_UTC="$$(cat /run/secrets/retention_dry_run_utc)"
        export VG_TELEGRAM_BOT_TOKEN="$$(cat /run/secrets/telegram_bot_token)"
        export VG_TELEGRAM_WEBHOOK_SECRET="$$(cat /run/secrets/telegram_webhook_secret)"
        export VG_TELEGRAM_INBOX_KEY="$$(cat /run/secrets/telegram_inbox_key)"
        export VG_TELEGRAM_BOT_USER_ID="$$(cat /run/secrets/telegram_bot_user_id)"
        exec gosu 10001:10001 sh -ec 'mkdir -p -m 0700 /var/lib/videograbber/jobs/uploads; exec dotnet VideoGrabber.Platform.Api.dll'
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      VG_SESSION_JWT_ISSUER: ${VG_AUTH_ISSUER:?}
      VG_SESSION_JWT_AUDIENCE: videograbber
      Security__AllowedOrigins__0: https://${VG_STAGE_HOST:?}
      VG_PAYMENT_CATALOG_PATH: ${VG_PAYMENT_CATALOG_PATH:-/etc/videograbber/payment-catalog.json}
      VG_PAYMENT_RECONCILIATION_ENABLED: "false"
      VG_DELIVERY_WORKER_ENABLED: "true"
      VG_ARTIFACT_UPLOAD_ROOT: /var/lib/videograbber/jobs/uploads
      VG_RETENTION_ROOT: /var/lib/videograbber/jobs
      VG_RETENTION_ENABLED: ${VG_RETENTION_ENABLED:-false}
      VG_RETENTION_QUALIFIED: ${VG_RETENTION_QUALIFIED:-false}
      VG_RETENTION_DRY_RUN_CLEAN: ${VG_RETENTION_DRY_RUN_CLEAN:-false}
      VG_RETENTION_DRY_RUN_UTC: ${VG_RETENTION_DRY_RUN_UTC:-}
      VG_RETENTION_APPROVED: ${VG_RETENTION_APPROVED:-false}
      VG_LAST_BACKUP_UTC: ${VG_LAST_BACKUP_UTC:-}
      VG_TELEGRAM_API_BASE_URL: ${VG_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      VG_EGRESS_PROXY_URI: ${VG_EGRESS_PROXY_URI:?}
      VG_PLATFORM_LEASE_KEY_ID: ${VG_PLATFORM_LEASE_KEY_ID:-vg-lease-2026-09}
      VG_TELEGRAM_MINIAPP_URL: ${VG_TELEGRAM_MINIAPP_URL:?}
      VG_PLATFORM_PUBLIC_URL: ${VG_PLATFORM_PUBLIC_URL:?}
      VG_WEB_AUTH_RETURN_URI: ${VG_WEB_AUTH_RETURN_URI:?}
      VG_SUPABASE_URL: ${VG_SUPABASE_URL:?}
      VG_SUPABASE_PUBLISHABLE_KEY: ${VG_SUPABASE_PUBLISHABLE_KEY:?}
    secrets:
      - api_dsn
      - identity_dsn
      - admin_dsn
      - ledger_dsn
      - device_dsn
      - operations_dsn
      - worker_token
      - operations_token
      - session_key
      - lease_signing_key_pkcs8
      - source_encryption_key
      - last_backup_utc
      - retention_dry_run_utc
      - telegram_bot_token
      - telegram_webhook_secret
      - telegram_inbox_key
      - telegram_bot_user_id
    ports:
      - "127.0.0.1:${VG_STAGE_HTTP_PORT:-19230}:8080"
    volumes:
      - workerjobs:/var/lib/videograbber/jobs
      - ./payment-catalog.stage.example.json:/etc/videograbber/payment-catalog.json:ro
    networks: [internal, edge]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETGID","SETUID"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: ${VG_WORKER_IMAGE:?pinned worker image required}
    restart: unless-stopped
    user: "0:0"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        export VG_SERVER_WORKER_TOKEN="$$(cat /run/secrets/worker_token)"
        exec gosu 10001:10001 dotnet VideoGrabber.Platform.Worker.dll
    environment:
      VG_PLATFORM_API_URL: http://api:8080
      VG_WORKER_ID: ${VG_WORKER_ID:?}
      VG_EGRESS_PROXY_URI: ${VG_EGRESS_PROXY_URI:?}
      VG_WORKER_JOB_ROOT: /var/lib/videograbber/jobs
      VG_RETENTION_ENABLED: ${VG_RETENTION_ENABLED:-false}
    secrets: [worker_token]
    volumes:
      - workerjobs:/var/lib/videograbber/jobs
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETGID","SETUID"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0

  bot-api:
    profiles: ["local-bot-api"]
    image: ${VG_BOT_API_IMAGE:?qualified pinned bot api image required}
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID_FILE: /run/secrets/telegram_api_id
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram_api_hash
    secrets:
      - telegram_api_id
      - telegram_api_hash
    volumes:
      - botdata:/var/lib/telegram-bot-api
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0

  caddy:
    profiles: ["internal-caddy"]
    image: ${VG_CADDY_IMAGE:?pinned caddy image required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VG_STAGE_HOST: ${VG_STAGE_HOST:?}
    ports:
      - "127.0.0.1:${VG_STAGE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
    name: ${VG_ENVIRONMENT_NAME}-pgdata
  workerjobs:
    name: ${VG_ENVIRONMENT_NAME}-workerjobs
  botdata:
    name: ${VG_ENVIRONMENT_NAME}-botdata
  caddydata:
    name: ${VG_ENVIRONMENT_NAME}-caddydata
  caddyconfig:
    name: ${VG_ENVIRONMENT_NAME}-caddyconfig

secrets:
  postgres_password:
    file: ${VG_POSTGRES_PASSWORD_FILE:?}
  migration_dsn:
    file: ${VG_MIGRATION_DSN_FILE:?}
  api_dsn:
    file: ${VG_API_DSN_FILE:?}
  identity_dsn:
    file: ${VG_IDENTITY_DSN_FILE:?}
  admin_dsn:
    file: ${VG_ADMIN_DSN_FILE:?}
  ledger_dsn:
    file: ${VG_LEDGER_DSN_FILE:?}
  device_dsn:
    file: ${VG_DEVICE_DSN_FILE:?}
  operations_dsn:
    file: ${VG_OPERATIONS_DSN_FILE:?}
  api_password:
    file: ${VG_API_PASSWORD_FILE:?}
  identity_password:
    file: ${VG_IDENTITY_PASSWORD_FILE:?}
  admin_password:
    file: ${VG_ADMIN_PASSWORD_FILE:?}
  ledger_password:
    file: ${VG_LEDGER_PASSWORD_FILE:?}
  device_password:
    file: ${VG_DEVICE_PASSWORD_FILE:?}
  operations_password:
    file: ${VG_OPERATIONS_PASSWORD_FILE:?}
  worker_token:
    file: ${VG_WORKER_TOKEN_FILE:?}
  operations_token:
    file: ${VG_OPERATIONS_TOKEN_FILE:?}
  session_key:
    file: ${VG_SESSION_KEY_FILE:?}
  lease_signing_key_pkcs8:
    file: ${VG_LEASE_SIGNING_KEY_FILE:?}
  source_encryption_key:
    file: ${VG_SOURCE_ENCRYPTION_KEY_FILE:?}
  last_backup_utc:
    file: ${VG_LAST_BACKUP_UTC_FILE:?}
  retention_dry_run_utc:
    file: ${VG_RETENTION_DRY_RUN_UTC_FILE:?}
  telegram_bot_token:
    file: ${VG_TELEGRAM_BOT_TOKEN_FILE:?}
  telegram_webhook_secret:
    file: ${VG_TELEGRAM_WEBHOOK_SECRET_FILE:?}
  telegram_inbox_key:
    file: ${VG_TELEGRAM_INBOX_KEY_FILE:?}
  telegram_bot_user_id:
    file: ${VG_TELEGRAM_BOT_USER_ID_FILE:?}
  telegram_api_id:
    file: ${VG_TELEGRAM_API_ID_FILE:-./secrets/disabled}
  telegram_api_hash:
    file: ${VG_TELEGRAM_API_HASH_FILE:-./secrets/disabled}
