http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Reject loopback, RFC1918, carrier-grade NAT, link-local, benchmark,
# multicast/reserved and IPv6 local/link-local destinations.
acl forbidden_dst dst 0.0.0.0/8
acl forbidden_dst dst 10.0.0.0/8
acl forbidden_dst dst 100.64.0.0/10
acl forbidden_dst dst 127.0.0.0/8
acl forbidden_dst dst 169.254.0.0/16
acl forbidden_dst dst 172.16.0.0/12
acl forbidden_dst dst 192.168.0.0/16
acl forbidden_dst dst 198.18.0.0/15
acl forbidden_dst dst 224.0.0.0/4
acl forbidden_dst dst 240.0.0.0/4
acl forbidden_dst dst ::1
acl forbidden_dst dst fc00::/7
acl forbidden_dst dst fe80::/10
acl forbidden_dst dst ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_dst
http_access allow all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
visible_hostname videograbber-egress
